# 서버의 /opt/prkhj/docker-compose.yml 로 직접 복사해 둔다. cd.yml은 pull/up만 하고 이 파일은 옮기지 않는다.
# 같은 디렉토리에 .env 도 직접 둔다. 키는 루트 .env.example 과 같다.
# DB_HOST/DB_PORT/REDIS_HOST/REDIS_PORT 는 아래 environment 가 덮어쓰므로 .env 값은 무시된다.
services:
  app:
    image: ghcr.io/pjkhj/prkhj_backend_v3:latest
    container_name: prkhj-app
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: prkhj-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      MYSQL_DATABASE: ${DB_NAME:-prkhj}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: prkhj-redis
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
