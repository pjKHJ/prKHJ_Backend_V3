name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  # main is covered by cd.yml, which runs this workflow as its test job.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prkhj
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # @SpringBootTest boots the real context, so every env var without a
      # default in application.yaml must be present or the context fails.
      - name: Run tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: prkhj
          DB_USERNAME: root
          DB_PASSWORD: root
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          JWT_SECRET: ci-dummy-jwt-secret-not-a-real-secret-0123456789abcdef
          ENCRYPTION_PASSWORD: ci-dummy-encryption-password-not-a-real-secret
          ENCRYPTION_SALT: 0123456789abcdef0123456789abcdef
        run: ./gradlew test
